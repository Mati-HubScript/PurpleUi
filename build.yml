name: Build PurpleUI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: Win64
          - name: Android ARM64
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.platform.target }}

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: PurpleUI-${{ matrix.platform.name }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
